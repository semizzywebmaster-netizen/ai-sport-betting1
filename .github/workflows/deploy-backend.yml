name: Deploy Backend - cPanel Compatible

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Build Backend
        working-directory: ./backend
        run: |
          npm install
          npx prisma generate
          npm run build
      - name: Deploy to cPanel (example via FTP)
        # Configure FTP deploy or SSH as per your cPanel
        run: |
          echo "Build complete - upload dist/ to cPanel Node.js app"
          echo "Then in cPanel: Restart Node.js app"
          echo "Run: npx prisma migrate deploy"
